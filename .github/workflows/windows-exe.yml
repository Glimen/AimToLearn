# Build de l'exe Windows (PyInstaller).
# - Sur un tag de version (ex. v1.0) : l'exe est joint a une Release GitHub.
# - En lancement manuel : l'exe est seulement disponible en artefact du run.
name: Exe Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # creation de la Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Memes options que build_windows.bat (le .bat passe par le lanceur "py",
      # qui ne choisit pas forcement le Python installe par setup-python)
      - name: Build exe
        run: |
          pip install "pygame-ce>=2.5" pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name AimToLearn main.py

      - uses: actions/upload-artifact@v7
        with:
          name: AimToLearn-exe
          path: dist/AimToLearn.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/AimToLearn.exe --title "AimToLearn ${{ github.ref_name }}" --generate-notes
